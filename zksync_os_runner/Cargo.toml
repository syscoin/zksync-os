[package]
name = "zksync_os_runner"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
airbender-host = { workspace = true, features = ["gpu-prover"] }
common_constants = { workspace = true }
riscv_transpiler = { workspace = true, features = ["flamegraph"] }
cycle_marker = { path = "../cycle_marker", optional = true }
log = { workspace = true }
# SYSCOIN: Validate symbol metadata before upstream can allocate decompression buffers.
object = { version = "0.37.3", default-features = false, features = ["read", "std"] }
tempfile = "3.27.0"

[features]
cycle_marker = ["dep:cycle_marker", "cycle_marker/use_airbender_host"]
