name: Cargo deny check
on: pull_request
permissions: read-all
jobs:
  cargo-deny:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: workspace
            name: cargo-deny
          - scope: guest
            name: cargo-deny (zksync_os)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the reviewed scanner
        run: |
          rustup show active-toolchain
          cargo install cargo-deny --version 0.20.2 --locked
      - name: Test the fail-closed review gate
        run: python3 -m unittest discover -s scripts/tests -p test_dependency_advisories.py
      - name: Check exact OS dependency scope
        run: python3 scripts/check-dependency-advisories.py '${{ matrix.scope }}'
